<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Absensi Karyawan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Poppins:wght@300;400;500;600;700&display=swap">
<style>
/* Tata letak: kartu jam besar (jam server + penggaris jam kerja) di kiri, tombol aksi di kanan; status jaringan kantor selalu terlihat di header. */
:root{
  --bg:#F3F8F4; --surface:#FFFFFF; --surface-2:#EAF2EC; --fg:#14231A; --muted:#58695E; --line:#DCE7DF;
  --accent:#0E8F31; --accent-2:#19B34A; --accent-fg:#FFFFFF; --accent-soft:#DCF3E2; --brass:#A97A28; --brass-soft:#F5EACB;
  --hero-1:#18A83D; --hero-2:#0A7826;
  --ok:#0E8F31; --ok-bg:#DCF3E2; --warn:#8F5200; --warn-bg:#FBE9C6; --bad:#BE2F1F; --bad-bg:#FCE2DE;
  --info:#41566B; --info-bg:#E3EAF1; --sick:#6240A8; --sick-bg:#E9E2F6;
  --scrim:rgba(6,20,10,.55);
  --shadow:0 1px 2px rgba(10,60,25,.06),0 18px 40px -22px rgba(10,90,35,.40);
  --glow:rgba(25,179,74,.17);
  --font:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08120B; --surface:#0F1D13; --surface-2:#16281B; --fg:#E6F2E9; --muted:#8EA595; --line:#20352A;
    --accent:#3FD46B; --accent-2:#3FD46B; --accent-fg:#04140A; --accent-soft:#123A20; --brass:#E2B65B; --brass-soft:#3A2F16;
    --hero-1:#148A35; --hero-2:#0A5A22;
    --ok:#4ADE80; --ok-bg:#12351F; --warn:#F2B45A; --warn-bg:#3F2E0E; --bad:#FF8A7A; --bad-bg:#431B17;
    --info:#AEB9C8; --info-bg:#27313D; --sick:#B7A3F0; --sick-bg:#2B2347;
    --scrim:rgba(0,0,0,.65);
    --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 22px 44px -22px rgba(0,0,0,.7);
    --glow:rgba(63,212,107,.12);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08120B; --surface:#0F1D13; --surface-2:#16281B; --fg:#E6F2E9; --muted:#8EA595; --line:#20352A;
  --accent:#3FD46B; --accent-2:#3FD46B; --accent-fg:#04140A; --accent-soft:#123A20; --brass:#E2B65B; --brass-soft:#3A2F16;
  --hero-1:#148A35; --hero-2:#0A5A22;
  --ok:#4ADE80; --ok-bg:#12351F; --warn:#F2B45A; --warn-bg:#3F2E0E; --bad:#FF8A7A; --bad-bg:#431B17;
  --info:#AEB9C8; --info-bg:#27313D; --sick:#B7A3F0; --sick-bg:#2B2347;
  --scrim:rgba(0,0,0,.65);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 22px 44px -22px rgba(0,0,0,.7);
  --glow:rgba(63,212,107,.12);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);
  padding-block:max(20px,env(safe-area-inset-top,0px)) calc(56px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
#view{display:flex;flex-direction:column;gap:20px}
h2{font-size:16px;font-weight:600;margin:0;letter-spacing:-.005em;text-wrap:balance}
p{margin:0}
.muted,.small{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.pad{padding:20px}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;flex:none;color:var(--accent)}
.brand-name{font-weight:600;font-size:17px;letter-spacing:-.01em;overflow-wrap:anywhere}
.brand-sub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-width:0;max-width:100%}
.top-r .tabs{min-width:0}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.hero-clock{padding:24px 24px 20px;border-right:1px solid var(--line);min-width:0}
.hero-act{padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:720px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-clock{border-right:0;border-bottom:1px solid var(--line)}
}
.login{max-width:420px;margin:0 auto;width:100%}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500}
.clock{font-family:var(--mono);font-weight:500;font-size:clamp(40px,11vw,64px);line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:6px 0 22px}

.ruler{margin-bottom:10px}
.track{position:relative;height:10px;background:var(--surface-2);border-radius:999px}
.band{position:absolute;top:0;bottom:0;background:var(--accent-soft)}
.grace{position:absolute;top:0;bottom:0;background:var(--ok-bg);border-radius:999px 0 0 999px}
.mark{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--fg)}
.mark.in{background:var(--ok)}
.mark.out{background:var(--accent)}
.now{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--fg);transform:translateX(-50%);border-radius:2px}
.ticks{position:relative;height:20px;margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}

.status-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.who-line{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.who-line strong{color:var(--fg);font-weight:600}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0}
.kv dt{font-size:12px;color:var(--muted)}
.kv dd{margin:0;font-family:var(--mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.note{font-size:14px;overflow-wrap:anywhere}

.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:10px 16px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.big{min-height:60px;font-size:17px;width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{min-height:34px;padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.link{border:0;background:none;padding:0;font:inherit;font-size:13px;color:var(--accent);cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.btn,.tabs button{transition:background-color .15s,border-color .15s}}

.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:var(--ok-bg)}
.chip.warn{color:var(--warn);background:var(--warn-bg)}
.chip.bad{color:var(--bad);background:var(--bad-bg)}
.chip.info{color:var(--info);background:var(--info-bg)}
.chip.sick{color:var(--sick);background:var(--sick-bg)}
.chip.none{color:var(--muted);background:var(--surface-2)}
.net{display:inline-flex;flex-direction:column;align-items:flex-end;gap:2px}
.net .small{font-family:var(--mono);font-size:12px}

.sec-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.nav{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav .label{min-width:130px;text-align:center;font-weight:600}
.nav input[type=date]{width:auto}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.strip div{background:var(--surface);padding:10px 14px}
.strip b{display:block;font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.strip span{font-size:12px;color:var(--muted)}

.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:2px 12px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}
.r-date{font-weight:600}
.r-date small{color:var(--muted);font-weight:400}
.r-mid{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;min-width:0}
.r-mid .dur{color:var(--muted)}
.r-note{grid-column:2 / -1;font-size:13px;color:var(--muted);overflow-wrap:anywhere}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.name{white-space:normal;min-width:170px}
td.num,th.num{text-align:right}

label,.lbl{display:block;font-size:13px;font-weight:500;margin-bottom:4px}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
input[type=checkbox],input[type=radio]{width:auto}
textarea{min-height:96px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.seg{display:flex;gap:8px}
.seg label{flex:1;margin:0;position:relative}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:block;text-align:center;padding:9px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:500}
.seg input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{margin:0;position:relative}
.checks input{position:absolute;opacity:0;width:1px;height:1px}
.checks span{display:block;padding:7px 14px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-weight:500;font-size:14px}
.checks input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.checks input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

.banner{border:1px solid var(--bad);background:var(--bad-bg);color:var(--bad);padding:10px 14px;border-radius:10px;font-size:14px;overflow-wrap:anywhere}
.banner.note{border-color:var(--line);background:var(--warn-bg);color:var(--warn)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.pinbox{font-family:var(--mono);font-size:32px;font-weight:600;letter-spacing:.14em;text-align:center;padding:14px;border-radius:10px;background:var(--surface-2);user-select:all}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.item{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:12px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .who{min-width:0;overflow-wrap:anywhere}
.item .who strong{font-weight:600}
.item .btn-row{gap:8px}

.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(480px,100%);max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:30;max-width:calc(100% - 32px);text-align:center}

/* ===== Tampilan: petrol + kuningan, huruf serif untuk judul dan jam ===== */
body{background:var(--bg);background-image:radial-gradient(900px 420px at 12% -8%,var(--glow),transparent 70%);background-repeat:no-repeat;font-size:15px;line-height:1.55}
h2{font-family:var(--serif);font-weight:500;font-size:21px;letter-spacing:-.01em}
.wrap{gap:24px}
#view{gap:24px}
.top{padding-bottom:18px;border-bottom:1px solid var(--line)}
.logo{width:40px;height:40px;filter:drop-shadow(0 6px 10px var(--glow))}
.logo circle,.logo path{stroke:var(--accent-fg)}
.brand-name{font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:-.01em;line-height:1.15}
.brand-sub{font-size:13px}
.tabs{background:transparent;border:1px solid var(--line);padding:3px;gap:2px}
.tabs button{font-weight:600;font-size:13.5px;padding:7px 15px;color:var(--muted)}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-current="page"]{background:var(--fg);color:var(--bg);box-shadow:none}
.card{border-radius:20px;border-color:var(--line)}
.hero{box-shadow:var(--shadow);overflow:hidden}
.hero-clock{background:radial-gradient(120% 100% at 0% 0%,var(--accent-soft),transparent 62%);padding:30px 30px 24px}
.hero-act{padding:30px;justify-content:center;background:var(--surface)}
.clock{font-family:var(--serif);font-weight:400;font-size:clamp(46px,13vw,76px);letter-spacing:-.015em;line-height:1;margin:8px 0 28px;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum","lnum"}
.track{height:8px}
.band{background:var(--accent-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 25%,transparent)}
.grace{background:var(--ok-bg)}
.now{background:var(--brass);width:3px;top:-7px;bottom:-7px}
.ticks{font-size:12px}
.mark{width:16px;height:16px}
.kv dd{font-family:var(--serif);font-size:24px;font-weight:500}
.btn{border-radius:12px;font-weight:600;border-color:var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);box-shadow:0 10px 22px -10px color-mix(in srgb,var(--accent) 75%,transparent)}
.btn.primary:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 88%,var(--fg))}
.btn:hover:not(:disabled):not(.primary){background:var(--surface-2)}
.btn.big{min-height:64px;font-size:17px;border-radius:14px}
.chip{padding:3px 11px;font-size:12.5px}
.strip{display:flex;flex-wrap:wrap;overflow:hidden;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.strip div{flex:1 1 130px;min-width:fit-content;padding:14px 18px;background:transparent;box-shadow:-1px -1px 0 0 var(--line)}
.strip b{white-space:nowrap}
.strip b{font-family:var(--serif);font-size:32px;font-weight:500;line-height:1.1;letter-spacing:-.01em}
.strip span{font-size:12.5px}
.strip.board div:last-child b{color:var(--bad)}
.strip.board div:nth-child(2) b{color:var(--ok)}
.list,.rows,.tablewrap{border-radius:18px;border-color:var(--line)}
.item{padding:14px 18px;gap:10px 14px}
.item .who{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.item .who .tx{min-width:0}
.row{padding:14px 18px}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:15px;letter-spacing:.02em}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.av.done{background:var(--ok-bg);color:var(--ok)}
.prog{padding:20px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.prog-t{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.prog-n{font-family:var(--serif);font-size:44px;font-weight:400;line-height:1;letter-spacing:-.02em}
.prog-n small{font-size:22px;color:var(--muted);font-weight:400;margin-left:4px}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--ok))}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .6s cubic-bezier(.2,.7,.2,1)}}
input,select,textarea{border-radius:10px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.login{max-width:440px;margin-top:6vh;padding:30px;box-shadow:var(--shadow)}
.dialog{border-radius:20px;box-shadow:var(--shadow);padding:24px}
.pinbox{border-radius:14px;color:var(--brass);background:var(--brass-soft)}
.banner{border-radius:14px}
.empty{border-radius:18px}
.toast{border-radius:12px}
@media (max-width:720px){
  .hero-clock{padding:24px 22px 20px}.hero-act{padding:22px}
  .strip b{font-size:28px}
  .brand-name{font-size:20px}
  .prog-n{font-size:38px}
}

/* ===== Foto profil, jadwal, cuti ===== */
.chip.cuti{color:var(--brass);background:var(--brass-soft)}
.av{position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;background:var(--surface-2)}
.av.md{width:56px;height:56px;font-size:22px;font-family:var(--serif);font-weight:500}
.av.lg{width:104px;height:104px;font-size:40px;font-family:var(--serif);font-weight:500}
.mebtn{border:0;background:none;padding:0;cursor:pointer;border-radius:50%;display:inline-flex;box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--line)}
.mebtn .av{width:36px;height:36px;font-size:14px}
.foto-box{display:flex;justify-content:center;padding:6px 0}
input[type=file]{padding:9px 10px;font-size:14px}
.who-head{display:flex;align-items:center;gap:14px;min-width:0}
.who-head h2{overflow-wrap:anywhere}
.sel{min-width:min(260px,100%)}
.badge{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--brass);color:#fff;font-size:11.5px;line-height:18px;text-align:center}
.tabs button[aria-current="page"] .badge{background:var(--bg);color:var(--fg)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-h{font-size:12.5px;color:var(--muted);font-weight:600;text-align:center;padding:2px 0}
.cal-c{min-height:86px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:7px 9px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-c.blank{border:0;background:transparent}
.cal-c .n{font-family:var(--serif);font-size:18px;line-height:1.1}
.cal-c .l{font-size:11.5px;font-weight:700;line-height:1.2}
.cal-c .t{font-family:var(--mono);font-size:11px;color:var(--muted)}
.cal-c.today{box-shadow:0 0 0 2px var(--accent)}
.cal-c.k-hadir{background:var(--ok-bg);border-color:transparent}.cal-c.k-hadir .l{color:var(--ok)}
.cal-c.k-terlambat{background:var(--warn-bg);border-color:transparent}.cal-c.k-terlambat .l{color:var(--warn)}

    if(inf.key in st&&inf.key!=="minutes")st[inf.key]++;
    var w=inf.rec?minutesWorked(inf.rec):null;
    if(w)st.minutes+=w;
  }
  return st;
}
function mapOf(list,keyField){
  var m={};
  (list||[]).forEach(function(r){var k=keyField?r[keyField]:"_";if(!m[k])m[k]={};m[k][r.date]=r;});
  return keyField?m:(m._||{});
}

function chip(key){var s=STATUS[key]||STATUS.none;return '<span class="chip '+s.cls+'">'+s.label+'</span>';}
function fotoUrl(id,v){return v?API.replace(/\/functions\/v1\/absen$/,"")+"/storage/v1/object/public/abs-foto/"+encodeURIComponent(id)+".jpg?v="+encodeURIComponent(v):"";}
function avatar(nama,id,foto,cls){
  var i=esc((nama||"?").trim().charAt(0).toUpperCase());
  return '<span class="av'+(cls?" "+cls:"")+'" aria-hidden="true">'+i+(foto?'<img src="'+esc(fotoUrl(id,foto))+'" alt="" loading="lazy" onerror="this.remove()">':"")+'</span>';
}
function resizeImage(file){
  return new Promise(function(res,rej){
    if(!file||!/^image\//.test(file.type)){rej(new Error("tipe"));return;}
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      URL.revokeObjectURL(url);
      var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height,sd=Math.min(w,h);
      if(!sd){rej(new Error("kosong"));return;}
      var c=document.createElement("canvas");c.width=c.height=320;
      var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,320,320);
      x.drawImage(img,(w-sd)/2,(h-sd)/2,sd,sd,0,0,320,320);
      var d=c.toDataURL("image/jpeg",0.85);
      if(d.length>140000)d=c.toDataURL("image/jpeg",0.6);
      d.length>140000||d.indexOf("data:image/jpeg")!==0?rej(new Error("besar")):res(d);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("baca"));};
    img.src=url;
  });
}
function leaveDays(l){var n=0,d=l.start;while(d<=l.end&&n<400){if(isWorkday(d))n++;d=addDays(d,1);}return n;}
function leaveRange(l){
  var a=l.start.split("-").map(Number),b=l.end.split("-").map(Number);
  if(l.start===l.end)return a[2]+" "+MONTHS_SHORT[a[1]-1]+" "+a[0];
  return a[2]+" "+MONTHS_SHORT[a[1]-1]+(a[0]!==b[0]?" "+a[0]:"")+" – "+b[2]+" "+MONTHS_SHORT[b[1]-1]+" "+b[0];
}
function leaveChip(st){return st==="disetujui"?chip("cuti"):st==="ditolak"?'<span class="chip bad">Ditolak</span>':'<span class="chip warn">Menunggu</span>';}
function toast(msg){var t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true;},3200);}
function copyText(t){
  try{navigator.clipboard.writeText(t).then(function(){toast("Disalin");},function(){toast("Salin manual dari kotak");});}
  catch(e){toast("Salin manual dari kotak");}
}

/* ---------- komunikasi dengan server ---------- */
async function api(action,payload,anon){
  var ctl=new AbortController(),to=setTimeout(function(){ctl.abort();},20000);
  try{
    var r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action:action,kode:anon?null:S.kode,pin:anon?null:S.pin,payload:payload||{}}),signal:ctl.signal});
    var d=null;try{d=await r.json();}catch(e){}
    return d||{ok:false,error:"server"};
  }catch(e){return {ok:false,error:"jaringan"};}
  finally{clearTimeout(to);}
}
function applyNet(r){
  if(r&&typeof r.kantor==="boolean"){S.kantor=r.kantor;}
  if(r&&"ip" in r)S.ip=r.ip;
}
async function doPing(){
  var r=await api("ping",{},true);
  if(r.ok){applyNet(r);S.cfg.enforce=r.enforce!==false;if(r.company!=null)S.cfg.company=r.company||"";S.pingDone=true;}
  else S.pingDone=true;
}
async function loadStatus(){
  var r=await api("status",{month:S.histMonth||undefined});
  if(!r.ok){return r;}
  S.me=r.me;S.cfg=normCfg(r.cfg);applyNet(r);
  S.offset=Date.parse(r.server_time)-Date.now();
  S.today=r.today;
  S.recs=mapOf(r.records);S.lvSelf=r.leaves||[];S.todayRec=r.today_rec||null;S.since=r.me&&r.me.since||null;
  S.mustPin=!!r.me.must_change_pin;
  if(!S.histMonth)S.histMonth=monthOf(S.today);
  if(!S.day){S.day=S.today;}
  if(!S.month)S.month=monthOf(S.today);
  if(!S.schMonth)S.schMonth=monthOf(S.today);
  S.loaded=true;
  return r;
}
async function loadOverview(month){
  var r=await api("admin_overview",{month:month||S.ovMonth||S.month});
  if(!r.ok)return r;
  S.ov=r;S.ovMonth=month||S.ovMonth||S.month;
  S.cfg=normCfg(r.cfg);applyNet(r);
  S.ovRecs=mapOf(r.records,"emp");
  S.lvAll={};(r.leaves||[]).forEach(function(l){(S.lvAll[l.emp]=S.lvAll[l.emp]||[]).push(l);});
  return r;
}
function needOvMonth(){return S.sub==="harian"?monthOf(S.day):S.month;}
async function refreshAll(silent){
  if(!S.me)return;
  var r=await loadStatus();
  if(!r.ok){
    if(r.error==="auth"||r.error==="forbidden"){logout("Sesi berakhir. Masuk lagi.");return;}
    if(!silent){S.err=errMsg(r.error);}
  }else if(!silent){S.err="";}
  if(S.me&&S.tab==="kehadiran"){
    var b=await api("board",{});
    if(b.ok)S.board=b;else if(!silent)S.err=errMsg(b.error);
  }
  if(S.me&&!S.mustPin&&S.today&&(S.tab==="absen"||S.tab==="pengajuan")){
    var mi=await api("schedule",{month:monthOf(S.today)});
    if(mi.ok)S.mine=mi;
  }
  if(S.me&&S.tab==="jadwal"&&!S.mustPin){
    var sc=await api("schedule",{month:S.schMonth,emp:S.me.admin&&S.schEmp?S.schEmp:undefined});
    if(sc.ok&&sc.month===S.schMonth){S.sch=sc;S.schRecs=mapOf(sc.records);}else if(!sc.ok&&!silent)S.err=errMsg(sc.error);
  }
  if(S.me&&S.me.admin&&!S.mustPin){
    var al=await api("admin_leave_list",{});
    if(al.ok)S.adminLeaves=al.leaves;
  }
  if(S.me&&S.me.admin&&["rekap","karyawan","jaringan","pengaturan","cuti","jadwal"].indexOf(S.tab)>=0){
    var m=S.tab==="rekap"?needOvMonth():(S.ovMonth||monthOf(S.today));
    var o=await loadOverview(m);
    if(!o.ok&&!silent)S.err=errMsg(o.error);
  }
  render();
}
async function act(fn,okMsg){
  if(S.busy)return null;
  S.busy=true;render(true);
  var r=null;
  try{r=await fn();}catch(e){r={ok:false,error:"jaringan"};}
  S.busy=false;
  if(r&&r.ok){S.err="";if(okMsg)toast(okMsg);}
  else if(r){S.err=errMsg(r.error);if(r.error==="luar_kantor"){S.kantor=false;if(r.ip)S.ip=r.ip;}}
  return r;
}

/* ---------- kehadiran hari ini (semua karyawan) ---------- */
function viewKehadiran(){
  if(!S.board)return ovLoading();
  var list=S.board.list||[];

  var done=list.filter(function(x){return x.status&&x.status!=="cuti";}),todo=list.filter(function(x){return !x.status;});

  var strip='<div class="strip board"><div><b>'+list.length+'</b><span>Wajib absen</span></div><div><b>'+hadir+'</b><span>Hadir</span></div><div><b>'+izin+'</b><span>Izin / sakit / cuti</span></div><div><b>'+todo.length+'</b><span>Belum absen</span></div></div>';

  return '<section class="stack"><div class="sec-h"><h2>Kehadiran '+esc(longDate(S.today))+'</h2></div>'+off+prog+strip+

/* ---------- jadwal bulanan per karyawan ---------- */
var SHORT={hadir:"Hadir",terlambat:"Telat",izin:"Izin",sakit:"Sakit",cuti:"Cuti",alpa:"Alpa",libur:"Libur",belum:"Belum",none:""};
function schDay(d){
  var sc=S.sch,emp=sc.emp,rec=S.schRecs[d];
  if(rec)return {rec:rec,key:rec.status||"hadir"};
  if(emp.since&&d<emp.since)return {key:"none"};
  if(!isWorkday(d))return {key:"libur"};
  var lv=null;
  (sc.leaves||[]).forEach(function(l){if(d>=l.start&&d<=l.end&&l.status!=="ditolak"&&(!lv||l.status==="disetujui"))lv=l;});
  if(lv)return {key:"cuti",pending:lv.status==="diajukan"};
  if(emp.wajib===false||d>S.today)return {key:"none"};
  return {key:d===S.today?"belum":"alpa"};
}
function viewJadwal(){
  if(!S.sch||S.sch.month!==S.schMonth)return ovLoading();
  var sc=S.sch,ym=S.schMonth,emp=sc.emp,own=emp.id===S.me.id;
  var sel="";
  if(S.me.admin&&S.ov)sel='<div class="sel"><label for="f-schemp">Lihat jadwal karyawan</label><select id="f-schemp">'+S.ov.employees.filter(function(e){return e.aktif;}).map(function(e){return '<option value="'+esc(e.id)+'"'+(e.id===emp.id?" selected":"")+'>'+esc(e.nama)+'</option>';}).join("")+'</select></div>';
  var head='<div class="sec-h"><div class="who-head">'+avatar(emp.nama,emp.id,emp.foto,"md")+'<div><h2>'+esc(emp.nama)+'</h2><div class="small">'+esc(emp.divisi||"Tanpa divisi")+(own?" · jadwal saya":"")+'</div></div></div>'+sel+'</div>';
  var days=monthDays(ym),off=(dow(days[0])+6)%7,st={hadir:0,terlambat:0,izin:0,sakit:0,cuti:0,alpa:0,minutes:0};
  var cells=["Sen","Sel","Rab","Kam","Jum","Sab","Min"].map(function(h){return '<div class="cal-h">'+h+'</div>';}).join("");
  for(var i=0;i<off;i++)cells+='<div class="cal-c blank"></div>';
  days.forEach(function(d){
    var inf=schDay(d),r=inf.rec;
    if(inf.key in st&&!inf.pending)st[inf.key]++;
    var w=r?minutesWorked(r):null;if(w)st.minutes+=w;
    var lab=inf.pending?"Ajuan":(SHORT[inf.key]||"");
    cells+='<div class="cal-c k-'+inf.key+(inf.pending?" k-pending":"")+(d===S.today?" today":"")+'" title="'+esc(longDate(d)+(lab?": "+lab:""))+'"><span class="n">'+(+d.slice(8))+'</span>'+(lab?'<span class="l">'+lab+'</span>':"")+(r&&r.in?'<span class="t">'+hm(r.in)+'</span>':"")+'</div>';
  });
  var nav='<div class="sec-h"><h2>'+monthLabel(ym)+'</h2><div class="nav"><button type="button" class="btn sm ghost" data-act="sch-prev" aria-label="Bulan sebelumnya">‹</button>'+
    '<button type="button" class="btn sm" data-act="sch-now"'+(ym===monthOf(S.today)?" disabled":"")+'>Bulan ini</button>'+
    '<button type="button" class="btn sm ghost" data-act="sch-next" aria-label="Bulan berikutnya"'+(ym>=addMonth(monthOf(S.today),3)?" disabled":"")+'>›</button></div></div>';
  var strip='<div class="strip"><div><b>'+st.hadir+'</b><span>Tepat waktu</span></div><div><b>'+st.terlambat+'</b><span>Terlambat</span></div><div><b>'+st.izin+'</b><span>Izin</span></div><div><b>'+st.sakit+'</b><span>Sakit</span></div><div><b>'+st.cuti+'</b><span>Cuti</span></div><div><b>'+st.alpa+'</b><span>Alpa</span></div><div><b>'+fmtDur(st.minutes)+'</b><span>Total jam kerja</span></div></div>';
  var legend='<div class="legend">'+["hadir","terlambat","izin","sakit","cuti","alpa","libur"].map(chip).join("")+'</div>';
  var items=[];
  (sc.records||[]).forEach(function(r){if(r.status==="izin"||r.status==="sakit")items.push({sort:r.date,html:'<li class="item"><div class="who"><div class="tx"><strong>'+esc(longDate(r.date))+'</strong>'+(r.note?'<div class="small">'+esc(r.note)+'</div>':"")+'</div></div><div class="btn-row">'+chip(r.status)+'</div></li>'});});
  (sc.leaves||[]).forEach(function(l){items.push({sort:l.start,html:'<li class="item"><div class="who"><div class="tx"><strong>Cuti '+esc(leaveRange(l))+'</strong><div class="small">'+leaveDays(l)+' hari kerja'+(l.note?' · '+esc(l.note):"")+'</div></div></div><div class="btn-row">'+leaveChip(l.status)+'</div></li>'});});
  items.sort(function(a,b){return a.sort<b.sort?-1:1;});
  var izinBlock='<div class="stack"><h2>Izin dan cuti bulan ini</h2>'+(items.length?'<ul class="list">'+items.map(function(x){return x.html;}).join("")+'</ul>':'<div class="empty">Tidak ada izin atau cuti di bulan ini.</div>')+'</div>';
  var req=own?'<button type="button" class="btn primary" data-act="tab" data-tab="pengajuan">Ajukan cuti</button>':'<p class="small">Untuk menambah atau menyetujui cuti, buka Kelola › Cuti.</p>';
  return '<section class="stack">'+head+nav+'<div class="cal" role="grid" aria-label="Kalender '+esc(monthLabel(ym))+'">'+cells+'</div>'+legend+strip+izinBlock+req+'</section>';
}

/* ---------- render ---------- */
function viewHtml(){
  var err=S.err?'<div class="banner" role="alert">'+esc(S.err)+'</div>':"",b;
  if(!S.me)b=viewLogin();
  else if(S.mustPin)b=viewChangePin();
  else if(S.tab==="kehadiran")b='<h1 class="pt1">Kehadiran</h1>'+viewKehadiran();
  else if(S.tab==="riwayat")b=viewRiwayat();
  else if(S.tab==="profil")b=viewProfil();
  else if(S.tab==="jadwal")b=pageHead("Jadwal","absen")+viewJadwal();
  else if(S.tab==="pengajuan")b=pageHead("Pengajuan","absen")+viewPengajuan();
  else if(S.tab==="kelola"&&S.me.admin)b=pageHead("Kelola","absen")+viewKelola();
  else if(S.tab==="cuti"&&S.me.admin)b=pageHead("Cuti karyawan","kelola")+viewCuti();
  else if(S.tab==="rekap"&&S.me.admin)b=pageHead("Rekap","kelola")+viewRekap();
  else if(S.tab==="karyawan"&&S.me.admin)b=pageHead("Karyawan","kelola")+viewKaryawan();
  else if(S.tab==="jaringan"&&S.me.admin)b=pageHead("Jaringan","kelola")+viewJaringan();
  else if(S.tab==="pengaturan"&&S.me.admin)b=pageHead("Pengaturan","kelola")+viewSettings();
  else b=viewBeranda();
  return err+b;
}
function formFocused(){
  var a=document.activeElement;
  return !!(a&&$("#view").contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName));
}
function render(force){
  if(!force&&formFocused()){S.pending=true;return;}
  S.pending=false;
  renderHeader();
  $("#view").innerHTML=viewHtml();
}
document.addEventListener("focusout",function(){
  if(!S.pending)return;
  setTimeout(function(){if(S.pending&&!formFocused())render();},0);
});

/* ---------- aksi ---------- */
async function doLogin(f){
  var fd=new FormData(f);
  S.kode=String(fd.get("kode")||"").trim();S.pin=String(fd.get("pin")||"");
  S.err="";S.busy=true;render(true);
  var r=await loadStatus();
  S.busy=false;
  if(!r.ok){S.me=null;S.pin="";S.err=errMsg(r.error);render(true);return;}
  S.tab="absen";
  render(true);
  startPolling();
}
async function doChangePin(f){
  var fd=new FormData(f),a=String(fd.get("new")||""),b=String(fd.get("new2")||"");
  if(a!==b){S.err="Kedua PIN tidak sama.";render(true);return;}
  var r=await act(function(){return api("change_pin",{new_pin:a});},"PIN baru tersimpan");
  if(r&&r.ok){S.pin=a;await loadStatus();}
  render(true);
}
function logout(msg){
  stopPolling();
  S.me=null;S.pin="";S.board=null;S.ov=null;S.ovRecs=null;S.todayRec=null;S.recs={};S.tab="absen";S.mustPin=false;S.leaveOpen=false;S.confirmOut=false;S.modal=null;S.loaded=false;
  S.histMonth=null;S.day=null;S.month=null;S.ovMonth=null;S.sch=null;S.mine=null;S.schMonth=null;S.schEmp=null;S.adminLeaves=null;S.lvSelf=[];S.lvAll={};
  S.err=msg||"";
  renderModal();render(true);doPing().then(function(){render();});
}

async function saveSettings(f,enforceOverride){
  var fd=new FormData(f),c={};
  c.company=String(fd.get("company")||"").trim().slice(0,60);
  c.tz=TZ_LABEL[fd.get("tz")]?fd.get("tz"):DEFAULT_CFG.tz;
  c.start=String(fd.get("start")||"");c.end=String(fd.get("end")||"");
  c.grace=Math.max(0,Math.min(120,parseInt(fd.get("grace"),10)||0));
  c.workdays=Array.prototype.map.call(f.querySelectorAll('input[name="wd"]:checked'),function(i){return +i.value;});
  var seen={};
  c.libur=String(fd.get("libur")||"").split(/\s+/).filter(function(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!seen[s]&&(seen[s]=1);}).sort();
  c.enforce=S.cfg.enforce!==false;
  if(!c.start||!c.end||parseHM(c.start)>=parseHM(c.end)){S.err=ERR.jam_urutan;render(true);return;}
  if(!c.workdays.length){S.err="Pilih minimal satu hari kerja.";render(true);return;}
  var r=await act(function(){return api("admin_save_settings",c);},"Pengaturan disimpan");
  if(r&&r.ok)await refreshAll(true);
  render(true);
}

/* ---------- ekspor CSV ---------- */
function csvCell(v){
  var s=String(v==null?"":v);
  if(/^[=+\-@\t\r]/.test(s))s="'"+s;
  return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function exportCsv(){
  var ym=S.month,lines=[["Tanggal","Kode","Nama","Divisi","Masuk","Pulang","Durasi (menit)","Status","Terlambat (menit)","Catatan"]];
  activeEmps().forEach(function(e){
    monthDays(ym).forEach(function(d){
      if(d>S.today)return;
      var inf=dayInfo(S.ovRecs[e.id],e.since,d,e.id);
      if(["hadir","terlambat","izin","sakit","cuti","alpa"].indexOf(inf.key)<0)return;
      var r=inf.rec||{},w=minutesWorked(r);
      lines.push([d,e.kode,e.nama,e.divisi||"",r.in?hm(r.in):"",r.out?hm(r.out):"",w!=null?w:"",STATUS[inf.key].label,r.late||0,r.note||""]);
    });
  });
  var csv="﻿"+lines.map(function(l){return l.map(csvCell).join(";");}).join("\r\n");
  try{
    var url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");
    a.href=url;a.download="absensi-"+ym+".csv";document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},2000);
    toast("Berkas CSV diunduh");
  }catch(e){toast("Unduhan gagal disiapkan");}
}

/* ---------- navigasi & event ---------- */
async function go(tab){
  S.tab=tab;S.err="";
  try{if(location.hash.slice(1)!==tab)history.replaceState(null,"","#"+tab);}catch(e){}
  if(tab==="absen"&&S.today&&S.histMonth!==monthOf(S.today))S.histMonth=monthOf(S.today);
  render(true);
  window.scrollTo(0,0);
  await refreshAll(true);
}
async function setOvMonthAndLoad(){
  render(true);
  var o=await loadOverview(needOvMonth());
  if(!o.ok)S.err=errMsg(o.error);
  render(true);
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");
  if(!t)return;
  var a=t.dataset.act;
  if(t.tagName==="A")e.preventDefault();
  if(a==="fab"){go("absen");var pe=$("#presensi");if(pe)pe.scrollIntoView({behavior:"smooth",block:"center",inline:"start"});return;}
  if(a==="modal-scrim"){if(e.target!==t)return;a="modal-close";}
  if(a==="tab")return void go(t.dataset.tab);
  if(a==="logout")return logout();
  if(a==="recheck"){return void refreshAll(false);}
  if(a==="in")return void doAbsen("in");
  if(a==="out"){
    var n=nowParts();
    if(isWorkday(S.today)&&n.h*60+n.m<parseHM(S.cfg.end)){S.confirmOut=true;render(true);}else doAbsen("out");
    return;
  }
  if(a==="out-yes")return void doAbsen("out");
  if(a==="out-cancel"){S.confirmOut=false;return render(true);}
  if(a==="izin-open"){S.leaveOpen=true;return render(true);}
  if(a==="izin-cancel"){S.leaveOpen=false;return render(true);}
  if(a==="hist-prev"){S.histMonth=addMonth(S.histMonth,-1);render(true);return void refreshAll(true);}
  if(a==="hist-next"){S.histMonth=addMonth(S.histMonth,1);render(true);return void refreshAll(true);}
  if(a==="sub"){S.sub=t.dataset.sub;return void setOvMonthAndLoad();}
  if(a==="day-prev"){S.day=addDays(S.day,-1);return void setOvMonthAndLoad();}
  if(a==="day-next"){S.day=addDays(S.day,1);return void setOvMonthAndLoad();}
  if(a==="day-today"){S.day=S.today;return void setOvMonthAndLoad();}
  if(a==="month-prev"){S.month=addMonth(S.month,-1);return void setOvMonthAndLoad();}
  if(a==="month-next"){S.month=addMonth(S.month,1);return void setOvMonthAndLoad();}
  if(a==="export")return exportCsv();
  if(a==="edit"){S.modal={type:"edit",emp:t.dataset.emp,date:t.dataset.date};return renderModal();}
  if(a==="emp-new"){S.modal={type:"emp",emp:null};return renderModal();}
  if(a==="emp-edit"){var em=S.ov.employees.filter(function(x){return x.id===t.dataset.id;})[0];S.modal={type:"emp",emp:em};return renderModal();}
  if(a==="emp-reset"){return void resetPin(t.dataset.id);}
  if(a==="ip-del")return void delIp(t.dataset.id);
  if(a==="enforce")return void toggleEnforce();
  if(a==="pin-copy")return copyText(S.modal&&S.modal.pin||"");
  if(a==="modal-close"){S.modal=null;return renderModal();}
  if(a==="modal-del")return void delRecord();
  if(a==="foto-open"){S.modal={type:"foto",preview:null,msg:""};return renderModal();}
  if(a==="foto-save")return void saveFoto();
  if(a==="foto-del")return void delFoto();
  if(a==="sch-prev"||a==="sch-next"||a==="sch-now"){S.schMonth=a==="sch-now"?monthOf(S.today):addMonth(S.schMonth,a==="sch-prev"?-1:1);S.sch=null;render(true);return void refreshAll(true);}
  if(a==="leave-cancel")return void leaveAction("leave_cancel",{id:t.dataset.id},"Cuti dibatalkan");
  if(a==="leave-ok")return void leaveAction("admin_leave_decide",{id:t.dataset.id,status:"disetujui"},"Cuti disetujui");
  if(a==="leave-no")return void leaveAction("admin_leave_decide",{id:t.dataset.id,status:"ditolak"},"Cuti ditolak");
  if(a==="leave-del")return void leaveAction("admin_leave_del",{id:t.dataset.id},"Cuti dihapus");
  if(a==="cuti-add"){S.modal={type:"cutiadd"};return renderModal();}
});
document.addEventListener("submit",function(e){
  var f=e.target.closest("form[data-form]");
  if(!f)return;
  e.preventDefault();
  var k=f.dataset.form;
  if(k==="login")doLogin(f);
  else if(k==="pin")doChangePin(f);
  else if(k==="leave")doLeave(f);
  else if(k==="settings")saveSettings(f);
  else if(k==="ip-current")addIp(f,true);
  else if(k==="ip-manual")addIp(f,false);
  else if(k==="emp")saveEmp(f);
  else if(k==="edit")saveEdit(f);
  else if(k==="cutireq")doCutiReq(f);
  else if(k==="cutiadd")saveCutiAdd(f);
});
document.addEventListener("change",function(e){
  if(e.target.id==="f-foto"){onFotoFile(e.target.files&&e.target.files[0]);return;}
  if(e.target.id==="f-schemp"){S.schEmp=e.target.value;S.sch=null;render(true);refreshAll(true);return;}
  if(e.target.id==="f-day"&&/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)){S.day=e.target.value;setOvMonthAndLoad();}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&S.modal){S.modal=null;renderModal();}});

/* ---------- jam berjalan & penyegaran ---------- */
var pollT=null;
function tick(){
  if(!S.me||S.mustPin)return;
  var p=nowParts(),el=$("#clock");
  if(el)el.textContent=pad(p.h)+":"+pad(p.m)+":"+pad(p.s);
  if(S.today&&p.ymd!==S.today&&!S.busy){S.confirmOut=false;refreshAll(true);}
}
function startPolling(){
  stopPolling();
  pollT=setInterval(function(){
    if(document.hidden||!S.me||S.busy||S.modal||S.mustPin)return;
    if(formFocused())return;
    refreshAll(true);
  },20000);
}
function stopPolling(){if(pollT){clearInterval(pollT);pollT=null;}}
document.addEventListener("visibilitychange",function(){if(!document.hidden&&S.me&&!S.busy&&!S.modal&&!S.mustPin&&!formFocused())refreshAll(true);});
window.addEventListener("online",function(){if(S.me&&!S.mustPin)refreshAll(true);else doPing().then(function(){render();});});

/* ---------- mulai ---------- */
render(true);
setInterval(tick,1000);
doPing().then(function(){if(!S.me)render();});
})();
</script>
</body>
</html>
